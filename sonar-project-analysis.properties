# petclinic-legacy-modernization - BASADO EN README OFICIAL
sonar.projectKey=spring-petclinic-1.5.1-legacy
sonar.projectName=Spring PetClinic Official 1.5.1 - Legacy Analysis
sonar.projectVersion=1.5.1

# Paths específicos para estructura Spring Boot
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.libraries=~/.m2/repository/**/*.jar

# Configuración para análisis de modernización
sonar.language=java
sonar.sourceEncoding=UTF-8
sonar.java.binaries=target/classes
sonar.java.libraries=target/dependency/*.jar
# Excluir lo que no es código de negocio
sonar.exclusions=**/target/**, **/node_modules/**, **/*.json, **/*.yml

# SonarQube server
sonar.host.url=http://localhost:9000